{% extends "base.html" %}

{% block title %}Register - Personal Finance Advisor{% endblock %}

{% block content %}
<div class="auth-card">
    <div class="auth-header">
        <h2>Create an Account</h2>
        <p>Start tracking your expenses and achieving your financial goals.</p>
    </div>

    <form method="POST" action="{{ url_for('auth.register') }}" class="auth-form">
        <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" class="form-control" placeholder="John Doe" required autofocus>
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" class="form-control" placeholder="you@example.com" required>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="Create a strong password" required>
        </div>

        <div class="form-group">
            <label for="confirm_password">Confirm Password</label>
            <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Re-enter your password" required>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Register</button>
    </form>

    <div class="auth-footer">
        <p>Already have an account? <a href="{{ url_for('auth.login') }}">Log in here</a></p>
    </div>
</div>
{% endblock %}
